<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weather Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      background: #fff;
      color: #333;
    }
    .weather-card {
      width: 100%;
      max-width: 300px;
      margin: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }
    .weather-temp {
      font-size: 2em;
      font-weight: bold;
    }
    .weather-desc {
      text-transform: capitalize;
      margin-top: 4px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="weather-card">
    <div id="location">Loading...</div>
    <div id="temp" class="weather-temp"></div>
    <div id="desc" class="weather-desc"></div>
  </div>

  <script>
    const apiKey = "b83ae8f7817979486137963421d3efed"; // Your API key

    function showWeather(data) {
      document.getElementById("location").textContent = data.name;
      document.getElementById("temp").textContent = Math.round(data.main.temp) + "°F";
      document.getElementById("desc").textContent = data.weather[0].description;
    }

    function fetchWeather(lat, lon) {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=imperial`;
      fetch(url)
        .then(resp => resp.json())
        .then(showWeather)
        .catch(err => {
          document.getElementById("location").textContent = "Weather error";
        });
    }

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
          () => { document.getElementById("location").textContent = "Location unavailable"; }
        );
      } else {
        document.getElementById("location").textContent = "Geolocation not supported";
      }
    }

    getLocation();
  </script>
</body>
</html>
