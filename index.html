<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Widget</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      margin: 0;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    .location {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .temp {
      font-size: 2.5em;
      font-weight: bold;
      color: #0078D7;
      margin-bottom: 5px;
    }

    .description {
      font-size: 1em;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="weather-card">
    <div class="location">Loading...</div>
    <div class="temp">--°F</div>
    <div class="description">---</div>
  </div>

  <script>
    const apiKey = "b83ae8f7817979486137963421d3efed";

    // Get user location based on IP
    fetch("https://ipapi.co/json")
      .then(response => response.json())
      .then(locationData => {
        const lat = locationData.latitude;
        const lon = locationData.longitude;
        const city = locationData.city;

        document.querySelector(".location").textContent = city;

        // Fetch weather data
        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=imperial`)
          .then(response => response.json())
          .then(weatherData => {
            const temp = Math.round(weatherData.main.temp);
            const description = weatherData.weather[0].description;

            document.querySelector(".temp").textContent = `${temp}°F`;
            document.querySelector(".description").textContent = description.charAt(0).toUpperCase() + description.slice(1);
          })
          .catch(error => {
            console.error("Weather API error:", error);
            document.querySelector(".description").textContent = "Weather unavailable";
          });
      })
      .catch(error => {
        console.error("Location error:", error);
        document.querySelector(".location").textContent = "Location unavailable";
        document.querySelector(".description").textContent = "Weather unavailable";
      });
  </script>
</body>
</html>
