<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Widget</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .weather-card {
      background: white;
      border-radius: 10px;
      padding: 10px 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
      width: 180px;
    }

    .location {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .temp {
      font-size: 1.8em;
      font-weight: bold;
      color: #FFA626; /* Orange */
      margin-bottom: 4px;
    }

    .description {
      font-size: 0.9em;
      color: #555;
      margin-top: 4px;
    }

    .icon {
      width: 48px;
      height: 48px;
      margin: 6px auto;
    }
  </style>
</head>
<body>
  <div class="weather-card" id="weather">
    Loading weather...
  </div>

  <script>
    async function fetchWeather(lat, lon) {
      const apiKey = 'b83ae8f7817979486137963421d3efed'; // Your OpenWeatherMap API key
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${apiKey}`;

      const response = await fetch(url);
      const data = await response.json();

      const city = data.name;
      const temp = Math.round(data.main.temp);
      const description = data.weather[0].description;
      const icon = data.weather[0].icon;

      document.getElementById('weather').innerHTML = `
        <div class="location">${city}</div>
        <img class="icon" src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${description}">
        <div class="temp">${temp}°F</div>
        <div class="description">${description}</div>
      `;
    }

    function showError() {
      document.getElementById('weather').innerText = "Weather unavailable";
    }

    function getLocationAndFetchWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            fetchWeather(position.coords.latitude, position.coords.longitude);
          },
          error => {
            console.error('Geolocation error:', error);
            showError();
          }
        );
      } else {
        showError();
      }
    }

    getLocationAndFetchWeather();
  </script>
</body>
</html>
